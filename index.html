<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=17.4.2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007AFF" />
    <!-- v17.4.0 (PWA): installable on the restaurant tablets. apple-touch-icon
         is the FULL-BLEED png (iOS rounds it itself; transparent corners would
         render black). NB since v17.4.1 NOTHING registers a service worker —
         public/sw.js is only the kill switch (see src/main.jsx).
         v17.4.2: ?v= tokens carry the icon redesign past the HTTP cache. Bump
         them with __APP_SIGNATURE__ whenever the icon bytes change; a filename
         is otherwise cached for a year. This does NOT refresh an existing iOS
         home-screen shortcut — see the REFACTOR_LOG entry. -->
    <link rel="manifest" href="/manifest.webmanifest?v=17.4.2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=17.4.2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MGT Bookings" />
    <title>megustastu-bookings</title>
    <!-- v17.15.1: the stylesheet lives in src/index.css and is imported from
         src/main.jsx, so Vite emits it as a hashed /assets/index-*.css that the
         service worker caches CACHE-FIRST. It was 89 kB of this file, re-sent on
         every app open, because navigations are network-first. The theming-token
         rules that were documented here moved WITH it. Do not inline it again.

         The boot script below stays inline on purpose and is pinned in the CSP
         by SHA-256 (vercel.json + tests/csp.test.js) — edit it and you must
         regenerate that hash or the browser silently blocks it. NB: do not write
         a literal script tag in this comment. tests/csp.test.js finds the block
         by regex, so the tag name appearing in prose makes it hash the wrong
         bytes — the guard goes quiet while looking like it passed. -->
  </head>
  <body>
    <!-- v14.2.0: No-flash theme paint. Runs BEFORE React mounts so a dark-OS
         (or dark-saved) user never sees a light flash. Reads the per-device
         preference in localStorage["mgt-theme"] ("dark"|"light"), else falls
         back to the OS. MUST stay in sync with readThemePref() in src/App.jsx
         (same key, same value convention, and since v17.9.0 the same ?theme=
         override — which has to be honoured HERE too, or the DEV override paints
         the stored theme for one frame before React corrects it, i.e. exactly
         the flash this script exists to prevent).

         This script has no import.meta.env to gate on, so the override is gated
         on hostname instead. That is what keeps it out of production. -->
    <script>
      (function () {
        try {
          var forced = null;
          var h = location.hostname;
          if (h === "localhost" || h === "127.0.0.1" || h === "[::1]") {
            var q = /[?&]theme=(dark|light)\b/.exec(location.search);
            if (q) forced = q[1];
          }
          var saved = forced || localStorage.getItem("mgt-theme");
          var dark = saved === "dark"
            || (saved !== "light"
                && window.matchMedia
                && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          // v17.1.0: per-device "Reduce animations" (Settings → General) —
          // stamped pre-mount so no animation plays before React applies it.
          // Same key convention as the Settings Toggle in src/App.jsx.
          if (localStorage.getItem("mgt-reduce-motion") === "1") {
            document.documentElement.dataset.motion = "reduce";
          }
        } catch (e) { /* keep default data-theme="light" */ }
        // v17.8.0: iOS Safari only delivers :active to an element when a touch
        // listener exists somewhere on the document — without this, the whole
        // press-scale is a desktop-only feature, and the iPad on the pass (the
        // device with no hover state to fall back on, i.e. the one that needs
        // press feedback MOST) would get nothing at all. An empty passive
        // listener is the standard unlock; passive so it can never delay a
        // scroll. Lives here rather than in React so it also covers the login
        // screen and is in place before the first paint.
        try {
          document.addEventListener("touchstart", function () {}, { passive: true });
        } catch (e) { /* pre-2015 Safari: no options object — press stays hover-only */ }
        // v17.10.1: ?sw=off — the IN-BAND service-worker escape hatch.
        //
        // v17.4.0's worker could only be withdrawn by shipping a replacement,
        // which meant a frozen device stayed frozen until a deploy reached it.
        // This is the recovery that was missing: opening the app with `?sw=off`
        // unregisters every worker, drops every cache, and remembers the choice
        // on this device. It lives HERE, in the boot script, because it has to
        // work when React never mounts — which is exactly the state you would
        // be in when you need it.
        //
        // /code-review: it RELOADS when it is done, and that is the difference
        // between a recovery and a rumour. The page you run this on was already
        // claimed by the old worker, so unregistering changes nothing you can
        // see — a frozen app stays frozen, and the watchdog's "Reset offline
        // copy" button would render the same broken page a second time, which
        // reads as "the fix did nothing". Reloading to the CLEAN path (no
        // ?sw=off) both shows the result and cannot loop, because the reloaded
        // page no longer matches this branch.
        try {
          if (/[?&]sw=off\b/.test(location.search)) {
            try { localStorage.setItem("mgt-sw", "0"); } catch (e) {}
            var jobs = [];
            if (navigator.serviceWorker) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {}));
            }
            if (window.caches) {
              jobs.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }).catch(function () {}));
            }
            // replace(), not assign(): Back must not walk into ?sw=off again.
            Promise.all(jobs).then(function () {
              location.replace(location.pathname);
            });
          }
        } catch (e) { /* the Settings toggle is the other way out */ }
        // v17.10.1: BOOT WATCHDOG — the app said nothing when it failed to start.
        //
        // Found by testing the offline shell on the tablet with the server
        // stopped: the cached HTML was served, the bundle was not there, React
        // never mounted, and the screen stayed WHITE. No message, no way out.
        // That is within touching distance of the v17.4.0 symptom staff
        // reported ("it just sits there"), and it is not specific to the
        // service worker — a bad deploy, a blocked script or a dead network at
        // the wrong moment all land in the same place.
        //
        // So this is deliberately NOT part of the worker: it watches the one
        // thing that actually matters, whether the app rendered, and offers the
        // two things that fix it. 10s is well past a cold start on a slow
        // restaurant connection; a late mount removes the notice again.
        //
        // Inline handlers are impossible here (script-src has no 'unsafe-inline',
        // which is the whole point of the hash) — hence addEventListener.
        try {
          window.setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || root.children.length) return;
            var box = document.createElement("div");
            box.id = "mgt-boot-fail";
            box.setAttribute("style", "position:fixed;inset:0;display:flex;align-items:center;"
              + "justify-content:center;padding:24px;text-align:center;font:15px/1.5 -apple-system,"
              + "BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text-primary,#1a1d24);"
              + "background:var(--bg-app,#eef1f6);z-index:9999");
            var inner = document.createElement("div");
            inner.setAttribute("style", "max-width:22rem");
            var h = document.createElement("div");
            h.setAttribute("style", "font-size:19px;font-weight:600;margin-bottom:8px");
            h.textContent = "MGT Bookings didn't start";
            var p2 = document.createElement("p");
            p2.setAttribute("style", "opacity:.75;margin:0 0 18px");
            p2.textContent = "Your bookings are safe on the server. Try again, and if that "
              + "doesn't help, reset the offline copy of the app.";
            var btn = document.createElement("button");
            btn.setAttribute("style", "font:inherit;font-weight:600;color:#fff;background:#007AFF;"
              + "border:0;border-radius:999px;padding:11px 22px;margin:0 6px 8px;cursor:pointer");
            btn.textContent = "Try again";
            btn.addEventListener("click", function () { location.reload(); });
            var reset = document.createElement("button");
            reset.setAttribute("style", "font:inherit;font-weight:600;color:var(--text-primary,#1a1d24);"
              + "background:transparent;border:1px solid currentColor;border-radius:999px;"
              + "padding:11px 22px;margin:0 6px 8px;cursor:pointer;opacity:.8");
            reset.textContent = "Reset offline copy";
            reset.addEventListener("click", function () {
              location.href = location.pathname + "?sw=off";
            });
            inner.appendChild(h); inner.appendChild(p2);
            inner.appendChild(btn); inner.appendChild(reset);
            box.appendChild(inner);
            document.body.appendChild(box);
            // If React mounts late after all, get out of the way.
            // /code-review: BOUNDED. This used to poll twice a second forever
            // when React never mounted — which is the exact case it exists for,
            // so the handler for a broken app left a timer running on it. Two
            // minutes is far past any late mount worth waiting for.
            var tries = 0;
            var poll = window.setInterval(function () {
              if (root.children.length) {
                window.clearInterval(poll);
                if (box.parentNode) box.parentNode.removeChild(box);
              } else if (++tries > 240) {
                window.clearInterval(poll);
              }
            }, 500);
          }, 10000);
        } catch (e) { /* no watchdog; the app either starts or it doesn't */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
